name: Build Sarath & Malu Super Market V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/example/sarathmalusupermarket
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SarathMaluSuperMarket"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.sarathmalusupermarket'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.sarathmalusupermarket'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Sarath &amp; Malu Super Market</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B3B91</item>
                  <item name="android:navigationBarColor">#0B1220</item>
                  <item name="android:colorAccent">#1769E0</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/sarathmalusupermarket/MainActivity.java <<'EOF'
          package com.example.sarathmalusupermarket;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.inputmethod.InputMethodManager;
          import android.content.Context;
          import android.widget.*;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              LinearLayout cartLayout;
              TextView subtotalText;
              TextView discountText;
              TextView gstText;
              TextView totalText;
              TextView itemCountText;
              EditText discountInput;
              EditText searchInput;

              ArrayList<String> names = new ArrayList<>();
              ArrayList<Double> prices = new ArrayList<>();
              ArrayList<Integer> quantities = new ArrayList<>();

              String[] productNames = {
                      "Rice 5kg",
                      "Milk 1L",
                      "Bread",
                      "Sugar 1kg",
                      "Cooking Oil 1L",
                      "Biscuits",
                      "Tea 250g",
                      "Coffee 100g",
                      "Salt 1kg",
                      "Shampoo",
                      "Toothpaste",
                      "Detergent 1kg"
              };

              double[] productPrices = {
                      320, 55, 45, 52, 145, 30,
                      120, 210, 20, 180, 85, 110
              };

              String[] productIcons = {
                      "🍚","🥛","🍞","🍚","🫗","🍪",
                      "🍵","☕","🧂","🧴","🪥","🧼"
              };

              int blue = Color.rgb(16, 91, 210);
              int darkBlue = Color.rgb(7, 54, 135);
              int lightBlue = Color.rgb(239, 246, 255);
              int textDark = Color.rgb(25, 30, 38);
              int textGray = Color.rgb(105, 112, 122);
              int border = Color.rgb(225, 229, 235);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  buildScreen();
              }

              GradientDrawable bg(int color, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(radius);
                  return g;
              }

              GradientDrawable strokeBg(int fill, int stroke, float radius) {
                  GradientDrawable g = bg(fill, radius);
                  g.setStroke(2, stroke);
                  return g;
              }

              TextView text(String value, float size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  return t;
              }

              TextView textBold(String value, float size, int color) {
                  TextView t = text(value, size, color);
                  t.setTypeface(null, 1);
                  return t;
              }

              int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }

              LinearLayout.LayoutParams lp(int w, int h) {
                  return new LinearLayout.LayoutParams(
                          w == -2 ? -2 : (w == -1 ? -1 : dp(w)),
                          h == -2 ? -2 : (h == -1 ? -1 : dp(h))
                  );
              }

              LinearLayout.LayoutParams weighted(int w, int h, float weight) {
                  return new LinearLayout.LayoutParams(
                          w == 0 ? 0 : dp(w),
                          h == -1 ? -1 : dp(h),
                          weight
                  );
              }

              void buildScreen() {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(247, 249, 252));

                  root.addView(createHeader());

                  ScrollView mainScroll = new ScrollView(this);
                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(16), dp(14), dp(16), dp(25));

                  content.addView(createSearchBar());
                  content.addView(createCategories());
                  content.addView(createSectionTitle("PRODUCTS"));
                  content.addView(createProducts());
                  content.addView(createCart());
                  content.addView(createSummaryCards());
                  content.addView(createBottomActions());

                  mainScroll.addView(content);
                  root.addView(mainScroll,
                          new LinearLayout.LayoutParams(-1, 0, 1));

                  root.addView(createBottomNavigation());

                  setContentView(root);
              }

              View createHeader() {

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.VERTICAL);
                  header.setPadding(dp(18), dp(16), dp(18), dp(15));

                  GradientDrawable gradient = new GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          new int[]{darkBlue, blue});
                  header.setBackground(gradient);

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);

                  TextView icon = text("🛒", 28, Color.WHITE);
                  icon.setGravity(Gravity.CENTER);
                  icon.setBackground(bg(Color.rgb(38,112,225), dp(14)));

                  LinearLayout.LayoutParams iconParams =
                          new LinearLayout.LayoutParams(dp(55), dp(55));
                  top.addView(icon, iconParams);

                  LinearLayout titleBox = new LinearLayout(this);
                  titleBox.setOrientation(LinearLayout.VERTICAL
            - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Supermarket-Billing-V1
          path: '**/*.apk'
          if-no-files-found: error
