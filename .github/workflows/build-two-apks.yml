name: Build Sarath & Malu Two APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Customer and Admin APKs
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarath-Malu-Customer-APK
          path: customer/build/outputs/apk/debug/customer-debug.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarath-Malu-Admin-APK
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
